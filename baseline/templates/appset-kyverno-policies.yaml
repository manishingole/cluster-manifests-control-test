{{- if .Values.kyvernoPolicies.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: appset-kyverno-policies
  namespace: {{ .Values.argoNamespace }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          # 1. Git Generator – ArgoCD evaluates this
          - git:
              repoURL: {{ .Values.spec.source.repoURL }}
              revision: {{ .Values.spec.source.targetRevision }}
              directories:
                - path: policies/*
          # 2. Cluster Generator – must escape ApplicationSet variables for Helm
          - clusters:
              selector:
                matchLabels:
                  aspname: "{{ index (split "-" (index .path.segments 1)) 1 }}"
                  environment: "{{ index (split "-" (index .path.segments 1)) 2 }}"

  # Template section – Helm evaluates this, must escape ApplicationSet variables
  template:
    metadata:
      name: '{{.name}}-kyverno-policies'
      labels:
        app.kubernetes.io/name: kyverno-policies
        app.kubernetes.io/component: security
    spec:
      project: {{ .Values.argoProjectPlatform }}
      source:
        repoURL: {{ .Values.spec.source.repoURL }}
        targetRevision: {{ .Values.spec.source.targetRevision }}
        path: '{{.path.path}}'
        helm:
          releaseName: '{{.name}}-kyverno'
      destination:
        server: '{{.server}}'
        namespace: kyverno
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - ServerSideApply=true
{{- end }}





