{{- if .Values.kyvernoPolicies.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: appset-kyverno-policies
  namespace: {{ .Values.argoNamespace }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  generators:
    - matrix:
        generators:
          # 1. Git Generator – ArgoCD evaluates this part
          - git:
              repoURL: {{ .Values.spec.source.repoURL }}
              revision: {{ .Values.spec.source.targetRevision }}
              directories:
                - path: "policies/*"
                  parameters:
                    aspname: '{{ index (splitList "-" .basename) 1 }}'
                    environment: '{{ index (splitList "-" .basename) 2 }}'

          # 2. Cluster Generator – use escaped variables for Helm
          - clusters:
              selector:
                matchLabels:
                  aspname: "{{ parameters.aspname }}"
                  environment: "{{ parameters.environment }}"

  template:
    metadata:
      name: "{{ parameters.aspname }}-kyverno-policies"
      labels:
        app.kubernetes.io/name: kyverno-policies
        app.kubernetes.io/component: security
    spec:
      project: {{ .Values.argoProjectPlatform }}
      source:
        repoURL: {{ .Values.spec.source.repoURL }}
        targetRevision: {{ .Values.spec.source.targetRevision }}
        path: "{{ path }}"
        helm:
          releaseName: "{{ parameters.aspname }}-kyverno"
      destination:
        server: "{{ server }}"
        namespace: kyverno
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - ServerSideApply=true
{{- end }}
