{{- if .Values.kyvernoPolicies.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: appset-kyverno-policies
  namespace: {{ .Values.argoNamespace }}
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  generators:
  - matrix:  
      generators:
        - clusters:
            selector:
              matchLabels:
                aspname: '{{`{{ index (split "-" path.basename) 1 }}`}}'
                environment: '{{`{{ index (split "-" path.basename) 2 }}`}}'
        - git:
            repoURL: {{ .Values.spec.source.repoURL }}
            revision: {{ .Values.spec.source.targetRevision }}
            directories:
            - path: "policies/*"
  
  template:
    metadata:
      name: '{{`{{nameNormalized}}`}}-kyverno-policies'
      labels:
        app.kubernetes.io/name: kyverno-policies
        app.kubernetes.io/component: security
    spec:
      project: {{ .Values.argoProjectPlatform }}
      source:
        repoURL: {{ .Values.spec.source.repoURL }}
        targetRevision: {{ .Values.spec.source.targetRevision }}
        path: '{{`{{path}}`}}'
        helm:
          parameters:
          - name: "clusterName"
            value: '{{`{{path.basename}}`}}'
      destination: 
        server: '{{`{{server}}`}}'
        namespace: kyverno
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
        - ServerSideApply=true
{{- end }}
















